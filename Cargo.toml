[workspace]
members = ["crates/fixer-core", "crates/fixer-sdk", "crates/fixer-http", "crates/fixer-provider-local", "crates/fixer-writer-local", "crates/fixer-cli"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.85"

[workspace.dependencies]
language-tags = { version = "0.3.2", features = ["serde"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread", "time"] }
trybuild = "1.0.119"
futures-lite = "2.6.1"
futures-util = "0.3.34"
reqwest = { version = "0.13.4", default-features = false, features = ["rustls", "system-proxy", "socks"] }
quick-xml = { version = "0.41.0", features = ["serialize"] }
tempfile = "3.27.0"
insta = "1.47.0"
reflink-copy = "0.1.30"
clap = { version = "4.6.6", features = ["derive"] }
