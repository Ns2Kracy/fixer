[workspace]
members = ["crates/fixer-core", "crates/fixer-sdk", "crates/fixer-http", "crates/fixer-provider-local", "crates/fixer-writer-local", "crates/fixer-runtime", "crates/fixer-cli", "crates/fixer-provider-tmdb", "crates/fixer-provider-bangumi", "crates/fixer-provider-anilist", "crates/fixer-provider-musicbrainz", "crates/fixer-provider-openlibrary", "crates/fixer-server"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.85"

[workspace.dependencies]
language-tags = { version = "0.3.2", features = ["serde"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.20"
config = "=0.15.19"
dotenvy = "0.15.7"
toml = "1.1.4"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.22", features = ["env-filter", "fmt", "json"] }
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread", "time"] }
trybuild = "1.0.119"
futures-lite = "2.6.1"
futures-util = "0.3.34"
reqwest = { version = "0.13.4", default-features = false, features = ["rustls", "system-proxy", "socks"] }
quick-xml = { version = "0.41.0", features = ["serialize"] }
tempfile = "3.27.0"
insta = "1.47.0"
reflink-copy = "0.1.30"
clap = { version = "4.6.6", features = ["derive"] }
url = "2.5.8"
wiremock = "0.6.5"
zip = { version = "2.4.2", default-features = false, features = ["deflate"] }
axum = "0.8.9"
argon2 = "0.5.3"
base64 = "0.22.1"
getrandom = "0.4.3"
tower = "0.5.3"
http = "1.4.0"
http-body-util = "0.1.5"
ipnet = "2.12.0"
sqlx = { version = "0.8.6", default-features = false, features = ["runtime-tokio", "sqlite", "migrate", "macros"] }
fs2 = "0.4.3"
same-file = "1.0.6"
sha2 = "0.10.9"
