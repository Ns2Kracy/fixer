<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f3f0e8" />
    <script>
      (() => {
        const root = document.documentElement;
        let preference = "system";
        try {
          const stored = localStorage.getItem("fixer-theme");
          if (stored === "light" || stored === "dark" || stored === "system") {
            preference = stored;
          }
        } catch {
          // Storage may be unavailable; the system preference remains safe.
        }
        const systemDark = matchMedia("(prefers-color-scheme: dark)").matches;
        const theme =
          preference === "dark" || (preference === "system" && systemDark)
            ? "dark"
            : "light";
        root.dataset.theme = theme;
        root.style.colorScheme = theme;
        document
          .querySelector('meta[name="theme-color"]')
          ?.setAttribute("content", theme === "dark" ? "#171a16" : "#f3f0e8");
      })();
    </script>
    <meta name="description" content="Review, plan, and run metadata fixes." />
    <title>Fixer Workspace</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/index.tsx"></script>
  </body>
</html>
